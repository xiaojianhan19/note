<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8"></meta>
<link rel="stylesheet" th:href="@{/style.css}"></link>
<script th:inline="javascript">
/*<![CDATA[*/
function deleteItem(id) {
    document.getElementById("delId").value = id;
	deleteForm.submit();
}
/*]]>*/
</script>
</head>
<body>
<div layout:fragment="content">
  <form name="addForm" method="POST" action="#" th:action="@{/category/save}" th:object="${catBean}" > 
    <table class="table table-bordered noborder headline">
      <tr><td>名称</td><td ><input th:field="*{name}" /></td></tr>
      <tr><td>序号</td><td ><input th:field="*{orderNo}" /></td></tr>
      <tr><td>ID</td><td ><input th:field="*{id}" readonly="true"/></td></tr>
      <tr><td>上级分类</td><td ><input th:field="*{parent.id}" /> <b th:if="${parentName}!=null" th:text="${parentName}"></b></td></tr>      
      <tr><td>清除分类</td><td ><input type="checkbox" th:name="clearCategory" /></td></tr>
      <tr><td>关联分类</td><td ><input th:field="*{relatedId}" /></td></tr>
      <tr><td>类型</td><td ><input th:field="*{type}" class="type" /></td></tr>
      <tr><td>输入日期</td><td ><input th:field="*{date}" /></td></tr>
      <tr><td>开始日期</td><td ><input th:field="*{startDate}" /></td></tr>
      <tr><td>结束日期</td><td ><input th:field="*{endDate}" /></td></tr>
      <tr><td>清除日期</td><td ><input type="checkbox" th:name="clearDate" /></td></tr>
      <tr hidden=""><td>返回</td><td><input name="redirectId" th:value="${redirectId}" class="textbox"/></td></tr>
    </table>
      <input type="submit" value="Save" />
      <input th:unless="${catBean.id==0}" type="button" value="Delete" th:data-id="${catBean.id}" th:onclick="deleteItem(this.getAttribute('data-id'));" ></input>
  </form>

  <form name="deleteForm" method="POST" action="#" th:action="@{/category/delete}" >
    <input type="hidden" name="redirectId" th:value="${redirectId}"></input>
    <input type="hidden" id="delId" name="delId" value=""></input>
  </form>  

</div>
</body>
</html>
